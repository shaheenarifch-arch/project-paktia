name: Unreal build (Win64)

on:
  push:
    branches: ['bhaddru/**', main]
  workflow_dispatch:

concurrency:
  group: unreal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 120
    env:
      # Repo variable UE_ROOT (Settings > Secrets and variables > Actions > Variables).
      UE_ROOT: ${{ vars.UE_ROOT || 'C:\Program Files\Epic Games\UE_5.5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true    # the Kharg level (.umap/.uasset) is stored in Git LFS and must be present to cook

      - name: Build, cook, stage, pak and archive (Win64 Development)
        shell: cmd
        run: >
          "%UE_ROOT%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun
          -project="%GITHUB_WORKSPACE%\game\MidnightHavoc.uproject"
          -platform=Win64 -clientconfig=Development
          -build -cook -stage -pak -archive
          -archivedirectory="%GITHUB_WORKSPACE%\out"
          -unattended -utf8output -nop4

      - name: Check game data is in the package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # The packaged game reads missions/maps from MidnightHavoc/Content/HavocData (see game/README.md "Packaged builds").
          $f = Join-Path $env:GITHUB_WORKSPACE 'out\Windows\MidnightHavoc\Content\HavocData\missions\episode-04-open-strait.json'
          if (-not (Test-Path $f)) { Write-Host "::error::Game data missing from package: $f"; exit 1 }
          $n = (Get-ChildItem (Split-Path (Split-Path $f)) -Recurse -Filter *.json).Count
          Write-Host "Game data packaged: $n JSON files"

      - name: Automation tests (headless)
        shell: cmd
        run: >
          "%UE_ROOT%\Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          "%GITHUB_WORKSPACE%\game\MidnightHavoc.uproject"
          -ExecCmds="Automation RunTests MidnightHavoc; Quit"
          -unattended -nullrhi -nosplash -log
          -ReportExportPath="%GITHUB_WORKSPACE%\out\test-report"

      - name: Show test results and editor log (on failure)
        if: failure()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # Prints why the headless tests failed straight into the run log (no artifact download needed).
          # Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/automation-test-framework-in-unreal-engine
          $log = Join-Path $env:GITHUB_WORKSPACE 'game\Saved\Logs\MidnightHavoc.log'
          if (Test-Path $log) {
            Write-Host '--- failed tests and errors ---'
            Select-String -Path $log -Pattern 'Result=\{(Fail|Error)\}|Error:|Fatal|Assertion failed|Unhandled' | Select-Object -Last 80 | ForEach-Object { $_.Line }
            Write-Host '--- last 60 log lines ---'
            Get-Content $log -Tail 60
          } else { Write-Host "No editor log at $log" }

      # Build and smoke test run on the same PC (paktia-pc), so the smoke job takes the build from disk.
      # Uploading the ~GB zip kept dropping the PC's connection (ECONNRESET / "runner lost communication").
      - name: Keep the packaged build on this PC for the smoke test
        if: success()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $root = 'C:\havoc-builds'
          $dest = Join-Path $root "$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\out\Windows\*" -Destination $dest -Recurse -Force
          # Keep only the 3 newest builds so the disk does not fill up.
          Get-ChildItem $root -Directory | Sort-Object LastWriteTime -Descending | Select-Object -Skip 3 |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host "Packaged build kept at $dest"

      - name: Zip the packaged build
        if: success()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\out\Windows\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\MidnightHavoc-Win64.zip" -Force

      - name: Upload packaged build (download link; a network drop here doesn't fail the build)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MidnightHavoc-Win64
          path: MidnightHavoc-Win64.zip
          if-no-files-found: error

      - name: Upload logs and test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unreal-logs
          path: |
            out/test-report/**
            game/Saved/Logs/**
            ${{ env.APPDATA }}/Unreal Engine/AutomationTool/Logs/**
          if-no-files-found: warn

  smoke-test:
    needs: build
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      SMOKE_SECONDS: '90'    # per playable episode (game/scripts/playable-episodes.json)
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Use the packaged build kept on this PC by the build job
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $src = "C:\havoc-builds\$env:GITHUB_RUN_ID"
          if (-not (Test-Path $src)) { throw "No packaged build at $src (the build job keeps it there)." }
          Write-Host "Smoke test uses $src"

      - name: Smoke run (each playable episode in turn) and parse results
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: >
          ./game/scripts/smoke-episodes.ps1
          -BuildDir "C:\havoc-builds\$env:GITHUB_RUN_ID"
          -OutDir "$env:GITHUB_WORKSPACE\smoke-out"
          -Seconds ([int]$env:SMOKE_SECONDS)

      - name: Job summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path smoke-out\summary.md) { Get-Content smoke-out\summary.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY }
          else { 'Smoke test produced no summary (script failed before writing).' | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Upload smoke artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke-out/**
          if-no-files-found: warn

      - name: Post summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = fs.existsSync('smoke-out/summary.md')
              ? fs.readFileSync('smoke-out/summary.md', 'utf8')
              : '### Smoke test: \u274C FAIL\n- The smoke script did not produce a summary; see the run log.';
            body += `\n[Run, logs and artifacts](${runUrl}) \u00b7 commit \`${context.sha.slice(0, 7)}\``;
            // Find the triggering PR for this branch, else the issue number in the branch name (bhaddru/37-...).
            const branch = context.ref.replace('refs/heads/', '');
            let number = null;
            const prs = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`,
            });
            if (prs.data.length) number = prs.data[0].number;
            else {
              const m = branch.match(/^bhaddru\/(\d+)/);
              if (m) number = Number(m[1]);
            }
            if (!number) { core.notice('No PR or issue to comment on for ' + branch); return; }
            await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });

      - name: Fail if an episode world is not visible or a cutscene is missing
        # Only these checks fail the job (FPS and log results stay advisory). game/docs/smoke-test.md
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not (Test-Path smoke-out\result.json)) { Write-Error 'No smoke result.json'; exit 1 }
          $r = Get-Content smoke-out\result.json -Raw | ConvertFrom-Json
          $bad = @($r.reasons | Where-Object { $_ -match 'flat colour|No in-game screenshot|in-game screenshot|Cutscene:|no result' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Every playable episode: world visible, intro and outro played ($(@($r.episodes).Count) episode(s))"
