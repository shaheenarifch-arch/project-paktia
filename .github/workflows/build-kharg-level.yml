# One-off: generate the Kharg Island level (L_KhargHormuz) on paktia-pc and commit it through Git LFS.
# The packaged game starts on this map (Config/DefaultEngine.ini GameDefaultMap), so the smoke test needs it.
# Runs when this file changes on a bhaddru/** branch, or by hand: Actions > Build Kharg level > Run workflow.
# Steps: heightmap from Copernicus DEM -> build the editor -> run build_kharg_level.py headless -> commit -> start the Unreal build.
# Help: game/Content/Python/build_kharg_level.py, game/scripts/run-build-kharg-level.ps1
#       https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python
#       https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-git-large-file-storage
name: Build Kharg level

on:
  push:
    branches: ['bhaddru/**']
    paths: ['.github/workflows/build-kharg-level.yml']
  workflow_dispatch:

concurrency:
  group: kharg-level-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # push the level commit
  actions: write    # start the Unreal build afterwards

jobs:
  build-level:
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 120
    env:
      UE_ROOT: ${{ vars.UE_ROOT || 'C:\Program Files\Epic Games\UE_5.5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Make the heightmap (Copernicus DEM GLO-30)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # make_kharg_heightmap.py runs in normal Python 3, not inside Unreal.
          $py = if (Get-Command py -ErrorAction SilentlyContinue) { 'py' } else { 'python' }
          & $py -m pip install --user --quiet rasterio numpy pillow
          if ($LASTEXITCODE) { Write-Error "pip install failed. Install Python 3 on paktia-pc: https://www.python.org/downloads/windows/"; exit 1 }
          & $py game/Content/Python/make_kharg_heightmap.py --download
          if ($LASTEXITCODE) { exit 1 }

      - name: Build the editor (MidnightHavocEditor Win64)
        shell: cmd
        run: >
          "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" MidnightHavocEditor Win64 Development
          -Project="%GITHUB_WORKSPACE%\game\MidnightHavoc.uproject" -WaitMutex

      - name: Run build_kharg_level.py headless
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & ./game/scripts/run-build-kharg-level.ps1 -EngineDir $env:UE_ROOT
          $code = $LASTEXITCODE
          $log = Join-Path $env:GITHUB_WORKSPACE 'game\Saved\Logs\MidnightHavoc.log'
          if (Test-Path $log) {
            Write-Host '--- builder messages and errors ---'
            Select-String -Path $log -Pattern '\[KhargBuilder\]|Error:|Traceback|Exception' | Select-Object -Last 100 | ForEach-Object { $_.Line }
          }
          if (-not (Test-Path 'game\Content\Maps\Kharg\L_KhargHormuz.umap')) {
            Write-Error "L_KhargHormuz.umap was not created (editor exit code $code). See the messages above."; exit 1
          }

      - name: Commit the level (Git LFS)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .umap/.uasset are LFS-tracked in .gitattributes. World Partition keeps actors in __ExternalActors__.
          foreach ($p in 'game/Content/Maps/Kharg', 'game/Content/__ExternalActors__', 'game/Content/__ExternalObjects__', 'game/Config') {
            if (Test-Path $p) { git add -- $p }
          }
          git diff --cached --stat
          git commit -m "Kharg level: generate L_KhargHormuz with build_kharg_level.py (Build Kharg level workflow)"
          if ($LASTEXITCODE) { Write-Error 'Nothing to commit'; exit 1 }
          git push
          if ($LASTEXITCODE) { exit 1 }

      - name: Start the Unreal build for this branch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start it explicitly.
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/unreal-build.yml/dispatches"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          Invoke-RestMethod -Method Post -Uri $uri -Headers $h -Body (@{ ref = $env:GITHUB_REF_NAME } | ConvertTo-Json)

      - name: Upload editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kharg-level-logs
          path: game/Saved/Logs/**
          if-no-files-found: warn
