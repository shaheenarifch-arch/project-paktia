# One-off: generate the Paktia Highlands greybox level (L_PaktiaHighlands, Episode 01) on paktia-pc and commit it through Git LFS.
# Manual only (Actions > Build Paktia level > Run workflow): paktia-pc has one runner, so this must not queue by itself
# next to the Unreal build. Steps: build the editor -> run build_paktia_level.py headless -> commit -> start the Unreal build.
# Help: game/Content/Python/build_paktia_level.py, game/Content/Python/build_kharg_level.py (same launch)
#       https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python
#       https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-git-large-file-storage
name: Build Paktia level

on:
  workflow_dispatch:

concurrency:
  group: paktia-level-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # push the level commit
  actions: write    # start the Unreal build afterwards

jobs:
  build-level:
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 120
    env:
      UE_ROOT: ${{ vars.UE_ROOT || 'C:\Program Files\Epic Games\UE_5.5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build the editor (MidnightHavocEditor Win64)
        shell: cmd
        run: >
          "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" MidnightHavocEditor Win64 Development
          -Project="%GITHUB_WORKSPACE%\game\MidnightHavoc.uproject" -WaitMutex

      - name: Run build_paktia_level.py headless
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # Same launch as game/Content/Python/build_kharg_level.py (same launch), plus -RenderOffscreen: the runner is a Windows service with
          # no desktop, so the editor cannot open its main window (run #2 failed with DXGI_ERROR_NOT_CURRENTLY_AVAILABLE).
          # Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/command-line-arguments-in-unreal-engine
          & (Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe') (Join-Path $env:GITHUB_WORKSPACE 'game\MidnightHavoc.uproject') `
            "-ExecutePythonScript=$(Join-Path $env:GITHUB_WORKSPACE 'game\Content\Python\build_paktia_level.py')" `
            -unattended -nop4 -nosplash -log -RenderOffscreen
          $code = $LASTEXITCODE
          $log = Join-Path $env:GITHUB_WORKSPACE 'game\Saved\Logs\MidnightHavoc.log'
          if (Test-Path $log) {
            Write-Host '--- builder messages and errors ---'
            Select-String -Path $log -Pattern '\[PaktiaBuilder\]|Error:|Traceback|Exception' | Select-Object -Last 100 | ForEach-Object { $_.Line }
          }
          # The .umap is saved as soon as the level is created, so also fail on any Python error (no half-built level).
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Python script executed with errors' -Quiet)) {
            Write-Error 'build_paktia_level.py raised an error (see the Traceback above). Not committing a half-built level.'; exit 1
          }
          if (-not (Test-Path 'game\Content\Maps\Paktia\L_PaktiaHighlands.umap')) {
            Write-Error "L_PaktiaHighlands.umap was not created (editor exit code $code). See the messages above."; exit 1
          }

      - name: Commit the level (Git LFS)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .umap/.uasset are LFS-tracked in .gitattributes. World Partition keeps actors in __ExternalActors__.
          foreach ($p in 'game/Content/Maps/Paktia', 'game/Content/__ExternalActors__', 'game/Content/__ExternalObjects__', 'game/Config') {
            if (Test-Path $p) { git add -- $p }
          }
          git diff --cached --stat
          git commit -m "Paktia level: generate L_PaktiaHighlands with build_paktia_level.py (Build Paktia level workflow)"
          if ($LASTEXITCODE) { Write-Error 'Nothing to commit'; exit 1 }
          # Another level build may have pushed to this branch first; rebase so the push is a fast-forward.
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE) { exit 1 }
          git push
          if ($LASTEXITCODE) { exit 1 }

      - name: Start the Unreal build for this branch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start it explicitly.
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/unreal-build.yml/dispatches"
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          Invoke-RestMethod -Method Post -Uri $uri -Headers $h -Body (@{ ref = $env:GITHUB_REF_NAME } | ConvertTo-Json)

      - name: Upload editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paktia-level-logs
          path: game/Saved/Logs/**
          if-no-files-found: warn
