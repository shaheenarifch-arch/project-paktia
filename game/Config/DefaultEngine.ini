; Engine settings for MidnightHavoc (Project Settings > Maps & Modes).
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/map-and-modes-settings-in-unreal-engine
;       https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine
[/Script/EngineSettings.GameMapsSettings]
; The Kharg level is built by game/Content/Python/build_kharg_level.py (docs/kharg-level-guide.md).
; The game starts on it and shows the main menu (Play Episode 04, Settings, Quit).
GameDefaultMap=/Game/Maps/Kharg/L_KhargHormuz.L_KhargHormuz
EditorStartupMap=/Game/Maps/Kharg/L_KhargHormuz.L_KhargHormuz
GlobalDefaultGameMode=/Script/MidnightHavoc.HavocPlayableGameMode

[/Script/NavigationSystem.RecastNavMesh]
; Builds the navigation mesh at load time if a NavMeshBoundsVolume is placed (optional; AI falls back to
; straight-line movement without one). Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine
RuntimeGeneration=Dynamic

; Water plugin collision profile (UE 5.5). Without it the cook fails with
; "Collision Profile settings do not include an entry for the Water Body Collision profile".
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/water-system-in-unreal-engine
[/Script/Engine.CollisionProfile]
+Profiles=(Name="WaterBodyCollision",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="",CustomResponses=((Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Vehicle",Response=ECR_Overlap),(Channel="Destructible",Response=ECR_Overlap)),HelpMessage="Default Water Collision Profile (Created by Water Plugin)")
