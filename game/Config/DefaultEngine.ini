; Engine settings for MidnightHavoc (Project Settings > Maps & Modes).
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/map-and-modes-settings-in-unreal-engine
;       https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine

[/Script/EngineSettings.GameMapsSettings]
; The Kharg level is built by game/Content/Python/build_kharg_level.py (docs/kharg-level-guide.md).
; The game starts on it and shows the main menu (Play Episode 04, Settings, Quit).
GameDefaultMap=/Game/Maps/Kharg/L_KhargHormuz.L_KhargHormuz
EditorStartupMap=/Game/Maps/Kharg/L_KhargHormuz.L_KhargHormuz
GlobalDefaultGameMode=/Script/MidnightHavoc.HavocPlayableGameMode

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections (issue #71, graphics pass). 0 = none, 1 = Lumen.
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

[/Script/NavigationSystem.RecastNavMesh]
; Builds the navigation mesh at load time if a NavMeshBoundsVolume is placed (optional; AI falls back to
; straight-line movement without one). Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine
RuntimeGeneration=Dynamic
; Sized for the character capsule (radius 34, half height 88) so squads fit through doorways and walk the
; beaches. Cells are a little coarser than the default (19) because the Kharg level is a 20 km landscape.
; Squads (AI/, docs/ai.md) use the NavMesh for patrol points, MoveTo and the EQS cover query.
AgentRadius=34.0
AgentHeight=176.0
AgentMaxSlope=44.0
AgentMaxStepHeight=35.0
CellSize=25.0
CellHeight=10.0
; Bigger tiles keep the 5 x 6.8 km Kharg NavMeshBounds under the 1,048,576-tile limit (the old key
; "TileSizeUVs" was a typo and was ignored, so ~2.8M tiles were requested). Hard limit raised for headroom.
TileSizeUU=2000.0
TileNumberHardLimit=2097152

[/Script/NavigationSystem.NavigationSystemV1]
; Build a NavMesh without a hand-placed navigation data actor once a NavMeshBoundsVolume exists.
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False
bGenerateNavigationOnlyAroundNavigationInvokers=False

