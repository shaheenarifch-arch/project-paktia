; Havoc asset map: game role -> soft object path of a real Fab / Megascans asset.
; Read by UHavocAssetSubsystem (Source/MidnightHavoc/Assets). Swapping a pack is a
; config-only change: edit the path on the right, no C++ or Blueprint edits.
;
; Format:  Role=/Game/ThirdParty/<Pack>/<Folder>/<Asset>.<Asset>
;   (use "Copy Reference" > path in the Content Browser; Blueprint classes end in _C)
; Paths below are the expected target folders from docs/fab-assets.md. After you
; "Add to My Library" and add each pack to the project, set the exact asset name.
; A role whose asset is missing logs a LogHavocAssets warning and resolves to null.
; There are no placeholder or generated fallbacks by design.
;
; Help: https://dev.epicgames.com/documentation/en-us/fab/using-fab-in-unreal-engine
;       https://dev.epicgames.com/documentation/en-us/unreal-engine/referencing-assets-in-unreal-engine
;
; Episode 04 stays real_world_hypothetical: roles are generic, no real equipment specs.

[HavocAssets]
; Terrain and rocks
Terrain.Sand=/Game/ThirdParty/Megascans/Surfaces/Sand/MI_Sand.MI_Sand
Terrain.Rock=/Game/ThirdParty/Megascans/Surfaces/Rock/MI_Rock.MI_Rock
Props.Rocks=/Game/ThirdParty/Megascans/3D_Assets/Rocks/SM_Rock.SM_Rock
; Scrub
Foliage.Scrub=/Game/ThirdParty/Megascans/3D_Plants/Scrub/SM_Scrub.SM_Scrub
; Industrial
Props.Tank=/Game/ThirdParty/Industrial/Tanks/SM_Tank.SM_Tank
Props.Pipes=/Game/ThirdParty/Industrial/Pipes/SM_Pipes.SM_Pipes
Props.Pier=/Game/ThirdParty/Industrial/Pier/SM_Pier.SM_Pier
Props.Container=/Game/ThirdParty/Industrial/Containers/SM_Container.SM_Container
Props.Fence=/Game/ThirdParty/Industrial/Fencing/SM_Fence.SM_Fence
; Characters and weapons
Character.Marine=/Game/ThirdParty/Soldier/Meshes/SK_Marine.SK_Marine
Character.Marine.AnimBP=/Game/ThirdParty/Soldier/Animations/ABP_Marine.ABP_Marine_C
Weapon.KR47=/Game/ThirdParty/Weapons/Rifle/SK_Rifle.SK_Rifle
FX.Muzzle=/Game/ThirdParty/WeaponFX/NS_Muzzle.NS_Muzzle
; Vehicles and aircraft
Aircraft.Falcon=/Game/ThirdParty/Helicopter/SK_Helicopter.SK_Helicopter
Vessel.SmallBoat=/Game/ThirdParty/Boats/SK_SmallBoat.SK_SmallBoat
; FX
FX.Explosion.Large=/Game/ThirdParty/VFX/NS_ExplosionLarge.NS_ExplosionLarge
FX.Smoke=/Game/ThirdParty/VFX/NS_Smoke.NS_Smoke
FX.Water.Splash=/Game/ThirdParty/VFX/NS_WaterSplash.NS_WaterSplash
; Audio
Audio.Ambient.Coast=/Game/ThirdParty/Audio/Ambient/SC_CoastAmbient.SC_CoastAmbient
Audio.Weapon.Rifle=/Game/ThirdParty/Audio/Weapons/SC_RifleShot.SC_RifleShot
Audio.Explosion=/Game/ThirdParty/Audio/Weapons/SC_Explosion.SC_Explosion

; Custom Blender models (tools/blender/, docs/custom-models.md). Fictional, visual-only.
Vehicle.MRL.Enemy=/Game/Custom/MRLTruck/SK_MRLTruck.SK_MRLTruck
Vehicle.Artillery=/Game/Custom/Howitzer/SK_Howitzer.SK_Howitzer
