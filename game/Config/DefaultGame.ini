; Packaging settings for MidnightHavoc (Project Settings > Packaging).
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/packaging-unreal-engine-projects
[/Script/UnrealEd.ProjectPackagingSettings]
; Ship the repo-level JSON data (data/) with packaged builds. Staging a folder outside the
; project (../../data) did not reach the package, so the PreBuildSteps in MidnightHavoc.uproject
; copy data/ to Content/HavocData before every build, and it is staged from there.
; UHavocDataSubsystem falls back to <ProjectDir>/Content/HavocData when ../data is missing.
+DirectoriesToAlwaysStageAsNonUFS=(Path="HavocData")

; Episode levels (UHavocCampaign::EpisodeMapPath): Kharg is the default map and always cooked; the others are
; opened by "Play Episode N" / -HavocSmokeEpisode, so they must be listed or the package leaves them out.
+MapsToCook=(FilePath="/Game/Maps/Kharg/L_KhargHormuz")
+MapsToCook=(FilePath="/Game/Maps/PaktiaHighlands/L_PaktiaHighlands")
+MapsToCook=(FilePath="/Game/Maps/Gardun/L_Gardun")
