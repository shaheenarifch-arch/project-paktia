; Packaging settings for MidnightHavoc (Project Settings > Packaging).
; Help: https://dev.epicgames.com/documentation/en-us/unreal-engine/packaging-unreal-engine-projects
[/Script/UnrealEd.ProjectPackagingSettings]
; Stage the repo-level JSON data so the packaged game finds <ProjectDir>/../data
; (UHavocDataSubsystem default). Paths are relative to game/Content, so the repo's
; data/ folder is ../../data; it is staged next to the project folder as ../data.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../../data")
