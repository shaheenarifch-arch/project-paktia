name: Validate Project Paktia

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Validate required architecture files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f docs/architecture.md
          test -f docs/gardun-map.md
          test -f docs/vertical-slice.md
      - name: Basic secret-pattern scan
        run: |
          ! grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            -E "BEGIN PRIVATE KEY|CLOUDFLARE_API_TOKEN=|DATABASE_URL=.+" .
